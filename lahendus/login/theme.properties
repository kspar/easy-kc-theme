locales=en,et

parent=keycloak
import=common/keycloak

styles=css/login.css css/easy-login.css css/easy-login-prev.css

# The UT button's icon, inlined in easy-login.css rather than fetched.
#
# This was `fa fa-university`, which needed the whole of Font Awesome 4.7.0 from cdnjs for one
# glyph — and left the button blank whenever that request failed.
kcLogoIdP-ut=lahendus-idp-ut

# No stylesExternal, deliberately.
#
# It listed Font Awesome from cdnjs and Roboto+Sniglet from Google, and easy-login.css @imported the
# same two URLs again. Every visitor's browser contacted Cloudflare and Google at the identity
# provider, before signing in. Sniglet is served from this theme now, the icon is inline SVG, and
# Roboto turned out to be imported without ever being applied to a selector.
#
# Keep it that way: anything added here is a third party on the login page, and it also constrains
# any Content-Security-Policy the IdP vhost later grows.
