locales=en,et

parent=keycloak
import=common/keycloak

# One stylesheet. There used to be two, and the one named `easy-login-prev.css` held nearly every
# visual decision while loading last — so the file whose name suggested it was superseded won every
# conflict it took part in. Merged into one tokenised file.
#
# **The date in the filename is a cache-buster, and it has to be changed whenever this file's
# contents change in a way users must see.**
#
# Keycloak serves theme resources from /auth/resources/<version>/… with `Cache-Control:
# max-age=2592000` — thirty days, no ETag, no revalidation — and that <version> segment is derived
# from the Keycloak version, not from the theme. Tested: `kc.sh build` does not change it. So a
# browser that has fetched a stylesheet keeps it for a month no matter what is deployed underneath,
# and the only thing that can heal it is a different URL.
#
# That is not theoretical. Merging easy-login-prev.css into this file on 2026-09-01 moved the
# wordmark rules into a file browsers already had cached, so returning users got the stock Keycloak
# logo in place of Lahendus and could only fix it with a hard refresh — which nobody outside this
# repository knows to do.
#
# roles/nginx shortens the header going forward; renaming is what rescues the browsers already
# holding a copy.
styles=css/login.css css/easy-login.2026-09-01.css

# Turns on PatternFly's own dark theme, which is gated behind a class and has no media query.
#
# Without it, every PatternFly surface has to be re-darkened by hand in the stylesheet above, one
# at a time, as somebody notices each white rectangle — which is exactly how the language menu and
# the password input group were found after dark mode was already believed finished. PatternFly 4
# ships 96 rule blocks for this; using them beats reimplementing them badly.
#
# Keycloak injects `scripts=` into <head>, so the class is set before the body paints.
scripts=js/pf-theme-dark.js

# The UT button's icon, inlined in easy-login.css rather than fetched.
#
# This was `fa fa-university`, which needed the whole of Font Awesome 4.7.0 from cdnjs for one
# glyph — and left the button blank whenever that request failed.
kcLogoIdP-ut=lahendus-idp-ut

# No stylesExternal, deliberately.
#
# It listed Font Awesome from cdnjs and Roboto+Sniglet from Google, and easy-login.css @imported the
# same two URLs again. Every visitor's browser contacted Cloudflare and Google at the identity
# provider, before signing in. Sniglet is served from this theme now, the icon is inline SVG, and
# Roboto turned out to be imported without ever being applied to a selector.
#
# Keep it that way: anything added here is a third party on the login page, and it also constrains
# any Content-Security-Policy the IdP vhost later grows.
