parent=keycloak

# The two locales this theme actually has messages for, matching login/ and account/.
#
# It used to list twenty-eight locales and not "et" — so Estonian recipients got English mail while
# messages_et.properties sat here with forty-three strings in it, and the list implied support for
# Arabic and Thai that has never existed. Keycloak ships no Estonian of its own, so a locale this
# theme does not declare is a locale nobody serves.
locales=en,et
